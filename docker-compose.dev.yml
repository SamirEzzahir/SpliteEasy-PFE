# Local development (standalone file; no external proxy network required).
# Start: docker compose -f docker-compose.dev.yml up -d --build
# Stop:  docker compose -f docker-compose.dev.yml down
# Optional DEV_* overrides can go in the root .env; server settings are separate.
name: spliteasy-dev

services:
  database:
    build: ./database
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-spliteasy_dev}
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${DEV_POSTGRES_USER:-postgres}:${DEV_POSTGRES_PASSWORD:-postgres123}@database:5432/${DEV_POSTGRES_DB:-spliteasy_dev}
      JWT_SECRET: ${DEV_JWT_SECRET:-spliteasy-local-development-secret}
      SEED_DEMO: ${DEV_SEED_DEMO:-1}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-8800}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      target: deps
    # Refresh the persistent Linux dependencies when the lockfile changes.
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev:webpack -- --hostname 0.0.0.0 --port 3000"]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: ""
      BACKEND_PROXY_TARGET: http://backend:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:${DEV_BACKEND_PORT:-8800}
    ports:
      # Port 3000 can fall inside Docker Desktop / Windows reserved ranges.
      - "127.0.0.1:${DEV_WEB_PORT:-3100}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
